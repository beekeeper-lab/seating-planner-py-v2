[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seating-planner"
version = "0.1.0"
description = "Wedding seating planner built on OR-Tools CP-SAT"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-exclude = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib, so test modules in different tests/ subfolders may share a basename
# (tests/domain/test_locks.py and tests/solver/test_locks.py) without __init__.py.
addopts = "--import-mode=importlib"
